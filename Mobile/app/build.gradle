plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}
// The deployed production backend. ALL build types (debug + release) ship this URL so the app
// works the same on every machine, emulator and real device — independent of local.properties,
// which is git-ignored and differs per developer.
def prodApiBaseUrl = "https://unifur-git-454662189896.europe-west1.run.app/api/"
// Opt-in local backend for development: set `dev.api.base.url` in local.properties ONLY if you
// are actually running the backend locally (e.g. http://10.0.2.2:3000/api/ for the emulator).
// Leave it UNSET to use production. NOTE: the key is `dev.api.base.url` — the old `api.base.url`
// is intentionally ignored so a stale entry left on a teammate's machine can never break the app.
def localApiBaseUrl = properties.getProperty("dev.api.base.url", "").trim()
def debugApiBaseUrl = localApiBaseUrl.isEmpty() ? prodApiBaseUrl : localApiBaseUrl

android {
    namespace 'com.unifurniture.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.unifurniture.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Safe default: production URL. Build types below override as needed.
        buildConfigField "String", "API_BASE_URL", "\"${prodApiBaseUrl}\""
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"${prodApiBaseUrl}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Core Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.12.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // Lifecycle & ViewModel (Java-friendly)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // Retrofit2 + OkHttp (HTTP Client)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // Server-Sent Events client for streaming chatbot replies
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    // Markdown rendering for assistant replies
    implementation 'io.noties.markwon:core:4.6.2'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide (image loading)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Room (local database - offline cart cache)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // ViewPager2 (image slider)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Shimmer effect loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Dots indicator for ViewPager2
    implementation 'com.tbuonomo:dotsindicator:5.0'

    // PhotoView — pinch-to-zoom for image slider
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Encrypted storage for "Remember password" credentials
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // On-device translation for user reviews (free, offline after model download)
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
}